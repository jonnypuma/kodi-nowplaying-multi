    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Kodi Now Playing Overview</title>
        <link rel="stylesheet" href="/static/nowplaying-common.css">
        <script src="/static/nowplaying-common.js" defer></script>
        <style>
            :root {
                --bg0: #141414;
                --bg1: #222;
                --card: rgba(0, 0, 0, 0.55);
                --green: #4caf50;
                --amber: #ffb300;
                --red: #e53935;
                --muted: rgba(255, 255, 255, 0.65);
            }
            * { box-sizing: border-box; }
            body {
                margin: 0;
                min-height: 100vh;
                font-family: "Century Gothic", CenturyGothic, AppleGothic, sans-serif;
                color: #fff;
                background: linear-gradient(145deg, var(--bg0), var(--bg1) 55%, #2a2a2a);
            }
            header {
                display: flex;
                align-items: center;
                padding: 28px 32px 8px;
            }
            h1 {
                margin: 0;
                font-family: 'Arial Black', Arial, sans-serif;
                font-size: clamp(1.35rem, 3vw, 2.15rem);
                letter-spacing: 0.12em;
                text-transform: uppercase;
                background: linear-gradient(90deg, #ff6b35, #f7931e 40%, #4caf50);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                filter: drop-shadow(0 0 12px rgba(255, 107, 53, 0.35))
                        drop-shadow(2px 2px 0 rgba(0, 0, 0, 0.45));
            }
            #grid {
                display: grid;
                grid-template-columns: repeat(
                    auto-fit,
                    minmax(min(100%, max(260px, calc((100% - 3 * 18px) / 4))), 1fr)
                );
                gap: 18px;
                padding: 24px 32px 40px;
            }
            .tile {
                background: var(--card);
                border: 1px solid rgba(255,255,255,0.08);
                border-left: 4px solid rgba(255,255,255,0.2);
                border-radius: 12px;
                padding: 20px 18px;
                min-height: 160px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
                overflow: hidden;
            }
            .tile.playing { border-left-color: var(--green); cursor: pointer; }
            .tile.paused { border-left-color: var(--amber); cursor: pointer; }
            .tile.offline { border-left-color: var(--red); opacity: 0.85; }
            .tile.auth-failed { border-left-color: #ab47bc; opacity: 0.9; }
            .tile.idle { border-left-color: rgba(255,255,255,0.25); }
            .tile.checking { border-left-color: rgba(255,255,255,0.35); opacity: 0.92; }
            .tile.playing:hover, .tile.paused:hover {
                transform: translateY(-2px);
                background: rgba(0,0,0,0.7);
            }
            .tile-art {
                position: relative;
                margin: -20px -18px 4px;
                aspect-ratio: 16 / 9;
                height: auto;
                background: rgba(0,0,0,0.45);
                overflow: hidden;
            }
            .tile-art-bg {
                position: absolute;
                inset: 0;
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
            }
            .tile-art-dim {
                position: absolute;
                inset: 0;
                background: rgba(0, 0, 0, 0.45);
            }
            .tile-art img {
                position: relative;
                z-index: 1;
                width: 100%;
                height: 100%;
                display: block;
            }
            .tile-art img.tile-art-banner {
                object-fit: contain;
                object-position: center;
            }
            .tile-art img.tile-art-fill {
                object-fit: cover;
                object-position: center;
            }
            .tile-ip { font-size: 1.15rem; font-weight: 600; letter-spacing: 0.03em; }
            .tile-host { color: var(--muted); font-size: 0.85rem; word-break: break-all; }
            .badge {
                align-self: flex-start;
                padding: 4px 10px;
                border-radius: 999px;
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                background: rgba(255,255,255,0.1);
            }
            .badge.playing { background: rgba(76,175,80,0.25); color: #a5d6a7; }
            .badge.paused { background: rgba(255,179,0,0.22); color: #ffe082; }
            .badge.idle { background: rgba(255,255,255,0.08); color: var(--muted); }
            .badge.offline { background: rgba(229,57,53,0.22); color: #ef9a9a; }
            .badge.auth-failed { background: rgba(171,71,188,0.28); color: #e1bee7; }
            .badge.checking { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.75); }
            .tile-meta { color: var(--muted); font-size: 0.85rem; text-transform: capitalize; }
            .tile-ready { color: #a5d6a7; font-size: 0.75rem; }
            .tile-status-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                margin-top: auto;
            }
            .tile-title {
                font-size: 1.05rem;
                line-height: 1.35;
                flex: 1;
                min-width: 0;
            }
            .tile-retry {
                flex-shrink: 0;
                border: 1px solid rgba(255,255,255,0.25);
                background: rgba(255,255,255,0.08);
                color: #fff;
                border-radius: 8px;
                padding: 6px 10px;
                font-size: 0.8rem;
                cursor: pointer;
            }
            .tile-retry:hover { background: rgba(76,175,80,0.28); border-color: rgba(76,175,80,0.55); }
            .tile-retry:disabled {
                opacity: 0.55;
                cursor: wait;
            }
            .tile-backoff { color: #ef9a9a; font-size: 0.75rem; }
            .empty, .error-note {
                grid-column: 1 / -1;
                color: var(--muted);
                font-style: italic;
            }
            footer {
                padding: 0 32px 28px;
                color: var(--muted);
                font-size: 0.85rem;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Kodi Now Playing Overview</h1>
        </header>
        <div id="grid"><div class="empty">Loading servers…</div></div>
            <footer id="updated">Loading…</footer>
        <script>
            const grid = document.getElementById('grid');
            const updated = document.getElementById('updated');
            const REFRESH_MS = 12000;
            let knownServerIds = [];
            let refreshInFlight = false;

            function isAuthFailed(server) {
                return !!(server.auth_failed || server.error === 'Authentication failed');
            }

            function badgeClass(server) {
                if (server.loading) return 'checking';
                if (isAuthFailed(server)) return 'auth-failed';
                if (!server.connected) return 'offline';
                if (server.playing && server.paused) return 'paused';
                if (server.playing) return 'playing';
                return 'idle';
            }

            function badgeLabel(server) {
                if (server.loading) return 'Checking…';
                if (isAuthFailed(server)) return 'Auth failed';
                if (!server.connected) return 'Offline';
                if (server.playing && server.paused) return 'Paused';
                if (server.playing) return 'Playing';
                return 'Idle';
            }

            function tileClass(server) {
                return 'tile ' + badgeClass(server);
            }

            function formatBackoff(seconds) {
                const s = Math.max(0, Math.floor(seconds || 0));
                if (s <= 0) return '';
                const m = Math.floor(s / 60);
                const r = s % 60;
                if (m <= 0) return r + 's';
                return m + 'm ' + r + 's';
            }

            function statusTitle(server) {
                if (server.loading) return 'Checking connection…';
                if (server.playing) return server.title || 'Playing';
                if (server.connected) return 'Nothing playing';
                const backoff = formatBackoff(server.backoff_remaining);
                if (isAuthFailed(server)) {
                    return backoff
                        ? 'Wrong username/password · retry in ' + backoff
                        : 'Wrong username/password';
                }
                if (backoff) return (server.error || 'Connection failed') + ' · retry in ' + backoff;
                return server.error || 'Unreachable';
            }

            async function openServer(serverId, playing) {
                try {
                    await fetch('/api/switch-server/' + serverId, { method: 'POST' });
                } catch (e) {}
                window.location.href = playing ? '/loading' : '/';
            }

            async function retryServer(serverId, button) {
                if (button) {
                    button.disabled = true;
                    button.textContent = 'Retrying…';
                }
                try {
                    const res = await fetch('/api/retry-server/' + serverId, { method: 'POST' });
                    const data = await res.json();
                    if (data && data.server) {
                        updateServerTile(data.server);
                        updated.textContent = 'Auto-refresh · updated ' + new Date().toLocaleTimeString();
                        return;
                    }
                } catch (e) {}
                if (button) {
                    button.disabled = false;
                    button.textContent = 'Retry';
                }
                await refreshTiles();
            }

            function serverDisplayName(server) {
                if (!server) return '';
                const label = (server.label || '').trim();
                if (label) return label;
                return server.ip || server.host || ('Server ' + server.id);
            }

            function escapeHtml(value) {
                return String(value || '').replace(/[&<>"']/g, function (char) {
                    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[char];
                });
            }

            function tileArtHtml(server) {
                if (!server.thumb) return '';
                const alt = escapeHtml(server.title ? 'Artwork for ' + server.title : 'Current artwork');
                if (server.thumb_is_banner) {
                    const bg = server.fanart
                        ? '<div class="tile-art-bg" style="background-image:url(\'' + server.fanart + '\')"></div><div class="tile-art-dim"></div>'
                        : '';
                    return '<div class="tile-art">' + bg +
                        '<img class="tile-art-banner" src="' + server.thumb + '" alt="' + alt + '"></div>';
                }
                return '<div class="tile-art"><img class="tile-art-fill" src="' + server.thumb + '" alt="' + alt + '"></div>';
            }

            function buildTileElement(server) {
                const tile = document.createElement('div');
                tile.className = tileClass(server);
                tile.dataset.serverId = String(server.id);
                tile.dataset.thumb = server.thumb || '';
                const name = serverDisplayName(server);
                const subtitle = server.host || '';
                const title = statusTitle(server);
                const needsRetry = !server.loading && (!server.connected || !!server.error || (server.backoff_remaining > 0));
                const artHtml = tileArtHtml(server);
                const readyHtml = server.cache_ready
                    ? '<div class="tile-ready">Ready · instant open</div>'
                    : '';
                const retryHtml = needsRetry
                    ? '<button type="button" class="tile-retry" data-server-id="' + server.id + '">Retry</button>'
                    : '';
                const metaHtml = server.media_type && !server.loading
                    ? '<div class="tile-meta"></div>'
                    : '';
                tile.innerHTML =
                    artHtml +
                    '<div class="tile-ip"></div>' +
                    '<div class="tile-host"></div>' +
                    '<span class="badge ' + badgeClass(server) + '">' + badgeLabel(server) + '</span>' +
                    '<div class="tile-status-row"><div class="tile-title"></div>' + retryHtml + '</div>' +
                    metaHtml +
                    readyHtml;
                tile.querySelector('.tile-ip').textContent = name;
                tile.querySelector('.tile-host').textContent = subtitle;
                tile.querySelector('.tile-title').textContent = title;
                const meta = tile.querySelector('.tile-meta');
                if (meta) meta.textContent = server.media_type;
                const retryBtn = tile.querySelector('.tile-retry');
                if (retryBtn) {
                    retryBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        retryServer(server.id, retryBtn);
                    });
                }
                if (server.connected && !server.loading) {
                    tile.addEventListener('click', () => openServer(server.id, !!server.playing));
                    tile.title = server.playing
                        ? (server.cache_ready ? 'Open cached now playing' : 'Open now playing for this server')
                        : 'Select this server';
                } else {
                    tile.title = '';
                }
                return tile;
            }

            function applyServerToTile(tile, server) {
                tile.className = tileClass(server);
                tile.dataset.thumb = server.thumb || '';

                const nameEl = tile.querySelector('.tile-ip');
                const hostEl = tile.querySelector('.tile-host');
                const badge = tile.querySelector('.badge');
                const titleEl = tile.querySelector('.tile-title');
                const meta = tile.querySelector('.tile-meta');
                let readyEl = tile.querySelector('.tile-ready');
                const row = tile.querySelector('.tile-status-row');

                if (nameEl) nameEl.textContent = serverDisplayName(server);
                if (hostEl) hostEl.textContent = server.host || '';
                if (badge) {
                    badge.className = 'badge ' + badgeClass(server);
                    badge.textContent = badgeLabel(server);
                }
                if (titleEl) titleEl.textContent = statusTitle(server);
                if (meta) {
                    if (server.media_type && !server.loading) {
                        meta.textContent = server.media_type;
                        meta.style.display = '';
                    } else {
                        meta.style.display = 'none';
                    }
                }

                const needsRetry = !server.loading && (!server.connected || !!server.error || (server.backoff_remaining > 0));
                let retryBtn = tile.querySelector('.tile-retry');
                if (needsRetry) {
                    if (!retryBtn && row) {
                        retryBtn = document.createElement('button');
                        retryBtn.type = 'button';
                        retryBtn.className = 'tile-retry';
                        retryBtn.dataset.serverId = String(server.id);
                        retryBtn.textContent = 'Retry';
                        retryBtn.addEventListener('click', (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            retryServer(server.id, retryBtn);
                        });
                        row.appendChild(retryBtn);
                    } else if (retryBtn) {
                        retryBtn.disabled = false;
                        retryBtn.textContent = 'Retry';
                    }
                } else if (retryBtn) {
                    retryBtn.remove();
                }

                if (server.cache_ready) {
                    if (!readyEl) {
                        readyEl = document.createElement('div');
                        readyEl.className = 'tile-ready';
                        tile.appendChild(readyEl);
                    }
                    readyEl.textContent = 'Ready · instant open';
                } else if (readyEl) {
                    readyEl.remove();
                }

                tile.onclick = null;
                if (server.connected && !server.loading) {
                    tile.onclick = () => openServer(server.id, !!server.playing);
                    tile.title = server.playing
                        ? (server.cache_ready ? 'Open cached now playing' : 'Open now playing for this server')
                        : 'Select this server';
                } else {
                    tile.title = '';
                }
            }

            function updateServerTile(server) {
                const existing = grid.querySelector('[data-server-id="' + server.id + '"]');
                const prevThumb = existing ? (existing.dataset.thumb || '') : '';
                const newThumb = server.thumb || '';
                if (!existing) {
                    grid.appendChild(buildTileElement(server));
                    return;
                }
                if (prevThumb !== newThumb) {
                    existing.replaceWith(buildTileElement(server));
                    return;
                }
                applyServerToTile(existing, server);
            }

            function render(servers) {
                if (!servers.length) {
                    grid.innerHTML = '<div class="empty">No Kodi servers configured. Set KODI_HOST_1…N in .env</div>';
                    return;
                }
                grid.innerHTML = '';
                servers.forEach(server => {
                    grid.appendChild(buildTileElement(server));
                });
            }

            async function probeServer(serverId) {
                try {
                    const res = await fetch('/api/overview-server/' + serverId);
                    if (!res.ok) return;
                    const data = await res.json();
                    if (data && data.server) {
                        updateServerTile(data.server);
                    }
                } catch (e) {}
            }

            async function initialLoad() {
                try {
                    const res = await fetch('/api/overview');
                    if (!res.ok) throw new Error('overview failed');
                    const data = await res.json();
                    const servers = data.servers || [];
                    knownServerIds = servers.map(server => server.id);
                    render(servers);
                    updated.textContent = 'Checking servers…';
                    await Promise.all(knownServerIds.map(id => probeServer(id)));
                    updated.textContent = 'Auto-refresh every ' + Math.round(REFRESH_MS / 1000) + 's · updated ' + new Date().toLocaleTimeString();
                } catch (e) {
                    grid.innerHTML = '<div class="error-note">Failed to load overview</div>';
                    updated.textContent = 'Load failed · retrying…';
                }
            }

            async function refreshTiles() {
                if (refreshInFlight || !knownServerIds.length) return;
                refreshInFlight = true;
                try {
                    await Promise.all(knownServerIds.map(id => probeServer(id)));
                    updated.textContent = 'Auto-refresh every ' + Math.round(REFRESH_MS / 1000) + 's · updated ' + new Date().toLocaleTimeString();
                } catch (e) {
                    updated.textContent = 'Refresh failed · will retry…';
                } finally {
                    refreshInFlight = false;
                }
            }

            initialLoad();
            setInterval(refreshTiles, REFRESH_MS);
        </script>
    </body>
    </html>
