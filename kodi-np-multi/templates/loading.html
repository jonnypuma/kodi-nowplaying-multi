    <!DOCTYPE html>
    <html>
    <head>
        <title>Loading...</title>
        <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
        <style>
            @import url("https://fonts.googleapis.com/css?family=Montserrat:900");
            
            body {
                background-color: #141414;
                padding: 0;
                margin: 0;
                height: 100vh;
                width: 100vw;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: "Montserrat", sans-serif;
                opacity: 0;
                animation: fadeIn 0.5s ease forwards;
            }
            
            @keyframes fadeIn {
                from { opacity: 0; }
                to { opacity: 1; }
            }
            
            .loader {
                -webkit-perspective: 700px;
                perspective: 700px;
            }
            
            .loader > span {
                font-size: 130px;
                display: inline-block;
                animation: flip 2.6s infinite linear;
                transform-origin: 0 70%;
                transform-style: preserve-3d;
                -webkit-transform-style: preserve-3d;
                color: #4caf50;
            }
            
            @keyframes flip {
                35% {
                    transform: rotateX(360deg);
                }
                100% {
                    transform: rotateX(360deg);
                }
            }
            
            .loader > span:nth-child(even) {
                color: white;
            }
            
            .loader > span:nth-child(2) {
                animation-delay: 0.3s;
            }
            
            .loader > span:nth-child(3) {
                animation-delay: 0.6s;
            }
            
            .loader > span:nth-child(4) {
                animation-delay: 0.9s;
            }
            
            .loader > span:nth-child(5) {
                animation-delay: 1.2s;
            }
            
            .loader > span:nth-child(6) {
                animation-delay: 1.5s;
            }
            
            .loader > span:nth-child(7) {
                animation-delay: 1.8s;
            }
            
            .loading-bar {
                width: 320px;
                height: 10px;
                background: rgba(255, 255, 255, 0.18);
                border-radius: 999px;
                overflow: hidden;
                margin: 33px auto 0;
            }
            
            .loading-progress {
                height: 100%;
                width: 0%;
                background: linear-gradient(90deg, #4caf50, #7dd3fc);
                transition: width 0.2s ease;
            }
            
            .loading-text {
                margin-top: 10px;
                font-size: 0.9em;
                color: rgba(255, 255, 255, 0.8);
                letter-spacing: 0.5px;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <div class="loader">
            <span>L</span>
            <span>O</span>
            <span>A</span>
            <span>D</span>
            <span>I</span>
            <span>N</span>
            <span>G</span>
            <div class="loading-bar">
                <div id="loading-progress" class="loading-progress"></div>
            </div>
            <div id="loading-text" class="loading-text">Loading 0%</div>
        </div>
        <script>
            const bar = document.getElementById('loading-progress');
            const text = document.getElementById('loading-text');
            let jobId = null;
            let pollTimer = null;
            let contentRequested = false;

            function setProgress(percent, label) {
                const clamped = Math.min(100, Math.max(0, Math.round(percent)));
                if (bar) {
                    bar.style.width = clamped + '%';
                }
                if (text) {
                    text.textContent = (label ? label + ' ' : 'Loading ') + clamped + '%';
                }
            }

            function applyHtml(html) {
                // document.write keeps the current URL (/loading); move to /nowplaying first.
                try {
                    history.replaceState(null, '', '/nowplaying');
                } catch (e) {}
                document.body.style.opacity = '0';
                document.body.style.transition = 'opacity 0.5s ease';
                setTimeout(() => {
                    document.open();
                    document.write(html);
                    document.close();
                    // Now-playing pages may omit <title>; don't leave the tab on "Loading..."
                    if (!document.title || document.title === 'Loading...') {
                        document.title = 'Now Playing';
                    }
                }, 500);
            }

            function fetchContentOnce() {
                if (contentRequested || !jobId) return;
                contentRequested = true;
                clearInterval(pollTimer);
                pollTimer = null;
                fetch('/nowplaying-content/' + jobId)
                    .then(response => {
                        // 202 is "ok" for fetch; only accept a real 200 payload
                        if (response.status !== 200) {
                            throw new Error('HTTP ' + response.status);
                        }
                        return response.text();
                    })
                    .then(html => {
                        applyHtml(html);
                    })
                    .catch(() => {
                        // HTML is one-shot after a successful fetch; don't document.write a 202/410 body
                        window.location.href = '/nowplaying';
                    });
            }

            function pollStatus() {
                if (!jobId || contentRequested) return;
                fetch('/nowplaying-load-status/' + jobId)
                    .then(response => response.json())
                    .then(data => {
                        if (contentRequested) return;
                        setProgress(data.progress || 0, data.message || 'Loading');
                        if (data.status === 'done') {
                            fetchContentOnce();
                        } else if (data.status === 'error') {
                            clearInterval(pollTimer);
                            pollTimer = null;
                            text.textContent = data.message || 'Error loading';
                        }
                    })
                    .catch(() => {
                        // keep polling in case of transient errors
                    });
            }

            function startLoad() {
                fetch('/start-nowplaying-load')
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('HTTP ' + response.status);
                        }
                        return response.json();
                    })
                    .then(data => {
                        jobId = data.job_id;
                        pollTimer = setInterval(pollStatus, 400);
                        pollStatus();
                    })
                    .catch(() => {
                        window.location.href = '/nowplaying';
                    });
            }

            setTimeout(startLoad, 100);
        </script>
    </body>
    </html>
