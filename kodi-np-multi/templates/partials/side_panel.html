{# Shared side-panel chrome for movie / episode / music now-playing pages. #}
{# Each control is a peer .side-panel-item so vertical spacing stays uniform. #}
<div class="side-panel" id="sidePanel">
  <div class="side-panel-toggle" id="side-panel-toggle" onclick="toggleSidePanel()">
    <div class="side-panel-toggle-arrow">◄</div>
  </div>

  <div class="side-panel-body">
    <h1 class="retroshadow">Now Playing On</h1>

    <div class="side-panel-item">
      <div class="sec-center">
        <input class="dropdown" type="checkbox" id="serverDropdown" name="serverDropdown">
        <label class="for-dropdown" for="serverDropdown" id="serverDropdownLabel">Select Server <span style="font-size: 1.1em; margin-left: 8px; transition: transform 200ms linear; color: #fff;">▼</span></label>
        <div class="section-dropdown">
          <div id="serverDropdownList"></div>
        </div>
      </div>
    </div>

    <div class="side-panel-item">
      <a href="/overview" style="color: #4caf50; text-decoration: none;">Multi-server overview →</a>
    </div>

    <div class="side-panel-item side-panel-row">
      <label>Toggle blur:</label>
      <label class="toggle">
        <input type="checkbox" class="toggle__input" id="blurToggle" onchange="toggleBlur()">
        <span class="toggle-track">
          <span class="toggle-indicator">
            <svg class="checkMark" viewBox="0 0 20 20">
              <path d="M7.629,14.566c0.125,0.125,0.291,0.188,0.456,0.188c0.164,0,0.329-0.062,0.456-0.188l5.123-5.404c0.199-0.209,0.199-0.549,0-0.757c-0.198-0.209-0.52-0.209-0.717,0l-4.567,4.816l-2.125-2.125c-0.198-0.198-0.52-0.198-0.717,0c-0.197,0.199-0.197,0.52,0,0.717L7.629,14.566z"/>
            </svg>
          </span>
        </span>
      </label>
    </div>
    <div class="side-panel-item slider-container" id="blurSliderContainer">
      <label>Blur amount: <span class="slider-value" id="blurValue">50%</span></label>
      <input type="range" min="0" max="100" value="50" class="slider" id="blurSlider" oninput="updateBlurAmount(this.value)">
    </div>

    <div class="side-panel-item side-panel-row">
      <label>Toggle overlay:</label>
      <label class="toggle">
        <input type="checkbox" class="toggle__input" id="overlayToggle" checked onchange="toggleOverlay()">
        <span class="toggle-track">
          <span class="toggle-indicator">
            <svg class="checkMark" viewBox="0 0 20 20">
              <path d="M7.629,14.566c0.125,0.125,0.291,0.188,0.456,0.188c0.164,0,0.329-0.062,0.456-0.188l5.123-5.404c0.199-0.209,0.199-0.549,0-0.757c-0.198-0.209-0.52-0.209-0.717,0l-4.567,4.816l-2.125-2.125c-0.198-0.198-0.52-0.198-0.717,0c-0.197,0.199-0.197,0.52,0,0.717L7.629,14.566z"/>
            </svg>
          </span>
        </span>
      </label>
    </div>
    <div class="side-panel-item slider-container" id="opacitySliderContainer">
      <label>Overlay opacity: <span class="slider-value" id="opacityValue">85%</span></label>
      <input type="range" min="0" max="100" value="85" class="slider" id="opacitySlider" oninput="updateOverlayOpacity(this.value)">
    </div>

    <div class="side-panel-item side-panel-row">
      <label for="reducedMotionToggle">Reduce motion:</label>
      <label class="toggle">
        <input type="checkbox" class="toggle__input" id="reducedMotionToggle" onchange="toggleReducedMotion()">
        <span class="toggle-track"><span class="toggle-indicator"></span></span>
      </label>
    </div>

    <div class="side-panel-item slider-container">
      <label>Marquee shimmer interval: <span class="slider-value" id="marqueeIntervalValue">10s</span></label>
      <input type="range" min="5" max="60" value="10" class="slider" id="marqueeIntervalSlider" oninput="updateMarqueeInterval(this.value)">
    </div>

    <div class="side-panel-item slider-container">
      <label>Fanart slideshow interval: <span class="slider-value" id="fanartIntervalValue">20s</span></label>
      <input type="range" min="5" max="120" value="20" class="slider" id="fanartIntervalSlider" oninput="updateFanartInterval(this.value)">
    </div>
    <div class="side-panel-item slider-container">
      <label>Fanart min size: <span class="slider-value" id="fanartMinSizeValue">200kB</span></label>
      <input type="range" min="0" max="1000" value="200" class="slider" id="fanartMinSizeSlider" oninput="updateFanartMinSize(this.value)">
    </div>
    <div class="side-panel-item slider-note">Applies on refresh/new media load.</div>

    <div class="episode-prefs-only">
      <div class="side-panel-item side-panel-row">
        <label for="episodeTaglineToggle">Show tagline:</label>
        <label class="toggle">
          <input type="checkbox" class="toggle__input" id="episodeTaglineToggle" checked onchange="toggleEpisodeTagline()">
          <span class="toggle-track"><span class="toggle-indicator"></span></span>
        </label>
      </div>
      <div class="side-panel-item side-panel-row">
        <label for="episodeSeasonPlotToggle">Season plot:</label>
        <label class="toggle">
          <input type="checkbox" class="toggle__input" id="episodeSeasonPlotToggle" checked onchange="toggleEpisodeSeasonPlot()">
          <span class="toggle-track"><span class="toggle-indicator"></span></span>
        </label>
      </div>
      <div class="side-panel-item" id="episodeSeasonLabelContainer">
        <label for="episodeSeasonLabelSelect">Season label style:</label>
        <select id="episodeSeasonLabelSelect" class="side-panel-select" onchange="updateEpisodeSeasonLabelPreference(this.value)">
          <option value="number_and_named">Season number + named</option>
          <option value="named_only">Named season only</option>
        </select>
      </div>
    </div>
  </div>
</div>
